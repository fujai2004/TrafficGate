name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 2s --health-retries 20
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify
        working-directory: rate-limiter-service
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: docker compose -f deploy/docker-compose.yml up -d --build
      - run: node tests/stack-smoke.mjs
      - name: Verify Kafka decisions
        run: |
          docker compose -f deploy/docker-compose.yml exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server kafka:9092 --topic trafficgate.decisions --from-beginning --max-messages 1 --timeout-ms 20000 | grep '"decision"'
      - if: always()
        run: docker compose -f deploy/docker-compose.yml logs
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
