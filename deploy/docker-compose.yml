services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 3s
      timeout: 2s
      retries: 20
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL","/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 30
  limiter-a:
    build: ../rate-limiter-service
    ports: ["127.0.0.1:50051:50051","127.0.0.1:8081:8080"]
    environment: &limiter-env
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BUCKET_CAPACITY: 10
      REFILL_PER_SECOND: 1
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx256m -XX:ActiveProcessorCount=2
    depends_on: &limiter-deps
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
  limiter-b:
    build: ../rate-limiter-service
    ports: ["127.0.0.1:50052:50051","127.0.0.1:8082:8080"]
    environment: *limiter-env
    depends_on: *limiter-deps
  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
volumes:
  redis-data:
