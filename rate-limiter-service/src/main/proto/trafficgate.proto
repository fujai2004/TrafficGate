syntax = "proto3";
package trafficgate.v1;
option java_package = "com.trafficgate.proto";
option java_multiple_files = true;
service RateLimiter { rpc CheckQuota(CheckRequest) returns (CheckResponse); }
message CheckRequest { string client_id = 1; int32 cost = 2; }
message CheckResponse { bool allowed = 1; int64 remaining = 2; int64 retry_after_ms = 3; int64 capacity = 4; }
